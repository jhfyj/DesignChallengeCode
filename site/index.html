    <title>Weekly Design Challenge · Jennifer Huang</title>
    <meta name="description" content="One small interactive piece a week, designed and built in code by Jennifer Huang." />

<style>
  /* Layout: wireframe split, brand panel left (logo top, bio + links bottom), featured demo top right, row of all works beneath. */
  :root {
    color-scheme: light;
    --page: #FFFFFF;
    --panel: #F5F5F6;
    --line: #E4E4E8;
    --t1: #282828;
    --t2: #6b6b6b;
    --t3: #a8a8ac;
    --accent: #5E81E2;
    --tile: #EDEDEF;
    --r: 3px;
    --display: "DM Sans", system-ui, sans-serif;
    --body: "DM Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--t1); font-family: var(--body); }


  /* ---------- the page ---------- */
  .site {
    display: grid; grid-template-columns: 264px minmax(0, 1fr);
    min-height: 100vh;
    background: var(--page);
  }
  /* The panel runs the full height of the page; its contents stay pinned to the window. */
  .side { background: var(--panel); border-right: 1px solid var(--line); }
  .side-in {
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; justify-content: space-between; gap: 32px;
    padding: 28px 26px;
  }
  .logo { width: 52px; height: 52px; color: var(--accent); display: block; }
  .logo svg { width: 100%; height: 100%; display: block; }
  .bio { display: flex; flex-direction: column; gap: 8px; }
  .bio .links { margin-top: 18px; }
  .bio h1 { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; margin: 0; line-height: 1.15; }
  .bio p { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--t2); max-width: 30ch; }
  .links { list-style: none; margin: 0; padding: 18px 0 0; border-top: 1px solid var(--line); display: grid; gap: 2px; }
  .links a {
    display: flex; justify-content: space-between; align-items: center;
    text-decoration: none; color: var(--t1); font-size: 14px; padding: 7px 0;
  }
  .links a span:first-child { transition: color .2s; }
  .links a:hover span:first-child, .links a:focus-visible span:first-child { color: var(--accent); }
  .links a span:last-child { display: flex; color: var(--t3); transition: transform .2s, color .2s; }
  .links a:hover span:last-child, .links a:focus-visible span:last-child { color: var(--accent); transform: translate(2px, -2px); }

  .main { display: flex; flex-direction: column; gap: 28px; padding: 32px 36px 32px; min-width: 0; height: 100vh; }
  .eyebrow { font-family: var(--display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--t3); margin: 0; }
  .feature { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 18px; flex: 1; min-height: 0; }
  .feature-stage { min-width: 0; min-height: 0; position: relative; }
  .feature-media {
    position: relative; display: block; max-width: 100%; border-radius: var(--r); overflow: hidden; background: var(--tile);
    outline: none;
  }
  .feature-media img { width: 100%; height: 100%; object-fit: contain; display: block; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .feature-media:hover img { transform: scale(1.01); }
  .feature-media .open {
    position: absolute; right: 14px; bottom: 14px; background: var(--page); color: var(--t1);
    font-size: 13px; padding: 7px 12px; border-radius: var(--r); display: flex; gap: 8px; align-items: center;
    opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s;
  }
  .feature-media:hover .open, .feature-media:focus-visible .open { opacity: 1; transform: none; }
  .feature-media:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .feature-info { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .feature-top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .feature-info h2 { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.08; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
  .feature-info p { margin: 0; color: var(--t2); font-size: 15px; line-height: 1.5;  }
  .actions { display: flex; gap: 18px; font-size: 14px; white-space: nowrap; }
  .actions a { color: var(--t1); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  .actions a.primary { color: var(--accent); border-color: currentColor; }

  .works { display: flex; flex-direction: column; gap: 14px; }
  .works-head { display: flex; justify-content: space-between; align-items: baseline; }
  .row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(132px, 1fr); gap: 14px; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }
  .row::-webkit-scrollbar { display: none; }
  .row.dragging { cursor: grabbing; }
  .row.dragging .card { pointer-events: none; }
  .head-right { display: flex; align-items: center; gap: 12px; }

  .nav { display: flex; }
  /* Two separate buttons in the portfolio's control language: a soft frosted
     fill with a hairline edge, lifting to a white plate on hover. */
  .nav { gap: 6px; }
  .nav button {
    all: unset; cursor: pointer; width: 32px; height: 32px; display: grid; place-items: center;
    border-radius: var(--r); color: var(--t1);
    background: rgba(240, 240, 244, .7);
    box-shadow: inset 0 0 0 1px rgba(40, 40, 40, .08);
    transition: background .25s, box-shadow .25s, color .25s, opacity .25s;
  }
  .nav button:hover:not(:disabled) { background: #fff; box-shadow: inset 0 0 0 1px rgba(40, 40, 40, .08), 0 1px 3px rgba(0, 0, 0, .08); color: var(--accent); }
  .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .nav button:disabled { opacity: .3; cursor: default; }


  .card { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-width: 0; opacity: .5; transition: opacity .25s; }
  .card[aria-current="true"], .card:hover, .card:focus-visible { opacity: 1; }
  .card .thumb { aspect-ratio: 4 / 3; border-radius: var(--r); overflow: hidden; background: var(--tile); position: relative; }
  .card .thumb img { padding: 0; }
  .card img { width: 100%; height: 100%; object-fit: contain; display: block; transition: filter .3s, opacity .3s; }
  .card .cap { display: flex; flex-direction: column; gap: 1px; }
  .card .n { font-family: var(--display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--t3); }
  .card .t { font-size: 13px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card[aria-current="true"] .t { color: var(--t1); }
  .card[aria-current="true"] .n { color: var(--accent); }
  .card .thumb::after { content: ""; position: absolute; inset: 0; border-radius: var(--r); box-shadow: inset 0 0 0 0 var(--accent); transition: box-shadow .2s; }
  .card[aria-current="true"] .thumb::after { box-shadow: inset 0 0 0 1px rgba(94, 129, 226, .55); }
  .card:focus-visible .thumb { outline: 2px solid var(--accent); outline-offset: 2px; }


  @media (max-width: 860px) {
    .site { grid-template-columns: 1fr; height: auto; min-height: 0; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); }
    .side-in { position: static; height: auto; padding: 24px 20px; gap: 24px; }
    .main { padding: 28px 20px; overflow: visible; height: auto; }
    .feature { grid-template-rows: auto; }
    .feature-stage { height: auto; }
    .feature-media { position: relative; width: 100% !important; height: auto !important; }
    .feature-media img { height: auto; }
    .row { grid-auto-columns: 140px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
  // Add a new week here: folder = the name under weeks/, media = a file in docs/media/.
  const PROJECTS = [
    { num: 'Week 01', title: 'Night Market Ticket', folder: 'week-01-react', media: 'week-01-react.gif', text: 'A ticket you tear along the perforation, with sound that follows how fast you drag.' },
    { num: 'Week 02', title: 'Event Poster Kit', folder: 'week-02-react', media: 'week-02-react.gif', text: 'A grid-based poster generator for tech@nyu events. Shuffle for a new layout, lock what you like, export.' },
    { num: 'Week 03', title: 'Round Watch Assistant', folder: 'week-03-react', media: 'week-03-react.jpg', text: 'A voice assistant for a round watch face. Hold the mic, watch the rim listen, think and answer.' },
    { num: 'Week 04', title: 'Since When Was the Last Time You Had Some Fun?', folder: 'week-04-react', media: 'week-04-react.gif', text: 'A desktop that lifts away onto a playmat of colourful foam tiles.' },
    { num: 'Week 05', title: 'Graph Paper Corridor', folder: 'week-05-react', media: 'week-05-react.gif', text: 'Scroll through a hole in graph paper into a 3D corridor drawn entirely in grid lines.' },
    { num: 'Week 06', title: 'World Clock', folder: 'week-06-react', media: 'week-06-react.gif', text: 'Photos of cities redrawn as dots, lit by each place’s real local time.' },
    { num: 'Side project', title: 'Activity Log', folder: 'random-week-06-react', media: 'random-week-06-react.jpg', text: 'An endless history of past tasks on a phone. Scrub the tick rail, rest on one to open it.' },
  ];
  const LIVE = './';
  const REPO = 'https://github.com/jhfyj/DesignChallengeCode/tree/main/weeks/';
  const $ = (id) => document.getElementById(id);
  const row = $('row');

  function feature(i) {
    const p = PROJECTS[i];
    $('fImg').src = './media/' + p.media; $('fImg').alt = p.title;
    $('fNum').textContent = p.num; $('fTitle').textContent = p.title; $('fText').textContent = p.text;
    $('fMedia').href = $('fOpen').href = LIVE + p.folder + '/';
    $('fCode').href = REPO + p.folder;
    row.querySelectorAll('.card').forEach((c, j) => c.setAttribute('aria-current', j === i ? 'true' : 'false'));
  }
  PROJECTS.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'card';
    b.innerHTML = '<span class="thumb"><img loading="lazy" alt=""></span><span class="cap"><span class="n"></span><span class="t"></span></span>';
    b.querySelector('img').src = './media/' + p.media;
    b.querySelector('.n').textContent = p.num; b.querySelector('.t').textContent = p.title;
    b.addEventListener('click', () => feature(i));
    row.appendChild(b);
  });
  // Size the featured box to the demo's own shape so nothing is cropped or letterboxed.
  function fit() {
    const img = $('fImg'), st = $('fStage'), m = $('fMedia'), info = $('fInfo');
    if (!img.naturalWidth || matchMedia('(max-width: 860px)').matches) { m.style.width = m.style.height = info.style.maxWidth = ''; return; }
    const r = img.naturalWidth / img.naturalHeight, W = st.clientWidth, H = st.clientHeight;
    const w = Math.min(W, H * r);
    m.style.width = info.style.maxWidth = w + 'px'; m.style.height = (w / r) + 'px';
  }
  $('fImg').addEventListener('load', fit);
  addEventListener('resize', fit);
  feature(5);

  // Row scrolling: arrows step two works, the wheel scrolls sideways, and you can drag the row.
  const step = () => (row.querySelector('.card')?.offsetWidth || 150) + 14;
  $('prev').onclick = () => row.scrollBy({ left: -step() * 2, behavior: 'smooth' });
  $('next').onclick = () => row.scrollBy({ left: step() * 2, behavior: 'smooth' });
  row.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && row.scrollWidth > row.clientWidth) { e.preventDefault(); row.scrollLeft += e.deltaY; }
  }, { passive: false });
  let drag = null;
  row.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') drag = { x: e.clientX, l: row.scrollLeft, moved: false }; });
  addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    if (Math.abs(dx) > 4) { drag.moved = true; row.classList.add('dragging'); }
    if (drag.moved) row.scrollLeft = drag.l - dx;
  });
  addEventListener('pointerup', () => { drag = null; setTimeout(() => row.classList.remove('dragging'), 0); });

  function sync() {
    const max = row.scrollWidth - row.clientWidth;
    $('prev').disabled = row.scrollLeft <= 1;
    $('next').disabled = row.scrollLeft >= max - 1;
  }
  row.addEventListener('scroll', sync);
  addEventListener('resize', sync);
  setTimeout(sync, 50);
</script>
</body>
</html>
