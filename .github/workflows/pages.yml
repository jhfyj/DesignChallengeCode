name: Deploy showcase site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build every week
        run: |
          mkdir -p _site
          for dir in weeks/*/; do
            name=$(basename "$dir")
            echo "Building $name"
            (cd "$dir" && npx vite build --base=./ --outDir "$GITHUB_WORKSPACE/_site/$name" --emptyOutDir)
          done
      - name: Add landing page
        run: |
          cp site/index.html _site/index.html
          cp -r docs/media _site/media
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
